name: CI

# Runs on every push and PR so a build/vet/test/Dockerfile regression is caught
# before merge, not discovered by an operator pulling a broken image later.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Pinned to go.mod's directive so CI and local development always
          # agree on which toolchain compiled the binary being tested.
          go-version-file: go.mod
          # Caches the module + build cache keyed on go.sum; free speedup,
          # nothing to configure or invalidate by hand.
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            VERSION=ci-${{ github.sha }}
