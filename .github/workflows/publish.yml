name: Publish image

# Builds the Dockerfile and pushes to GHCR:
#   - a push to main updates the rolling `latest` (and `main`) tag
#   - pushing a vX.Y.Z tag additionally publishes semver-pinned tags, for anyone
#     who wants to pin a specific release instead of tracking latest
#   - workflow_dispatch lets this be fired by hand at any time, independent of
#     branch state (useful before a `main` branch exists on a fresh repo).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # docker/metadata-action lowercases this for us below — GHCR rejects mixed-case
  # image names, and github.repository here is "00101010xyz/MCPaw".
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # If this 403s, the repo's Settings -> Actions -> General -> "Workflow
      # permissions" is set to read-only and needs switching to read/write —
      # that's a repo setting, not something this workflow file can override.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
