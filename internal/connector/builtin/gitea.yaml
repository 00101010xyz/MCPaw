apiVersion: mcpaw.dev/v1
kind: Connector
metadata:
  id: gitea
  name: Gitea
  version: 2.0.0
  description: >-
    Read-only access to Gitea repositories — self-hosted or gitea.com. Lets
    an MCP client browse a repository's file tree and read file contents;
    also the basis for semantic search, which by default indexes every
    repository your API token can see (see internal/index/source/gitea). A
    token is what makes this connector useful — without one, there is
    little or nothing to find.
  documentation: https://docs.gitea.com/api/next
  tags: [gitea, git, repository, code, read-only]

spec:
  baseUrl:
    default: https://gitea.com
    description: >-
      Origin of your Gitea instance. Change this — the default is just
      gitea.com's hosted service, picked because it's a real, always-valid
      URL, not because it's likely what you want. For a self-hosted instance
      reachable from this container, that's often
      http://host.docker.internal:3000.

  auth:
    type: apiKey
    in: header
    name: Authorization
    value: "token {{secrets.token}}"

  variables:
    - name: owner
      description: >-
        Index only this one repository's owner (a user or organisation
        name), instead of every repository your token can see. Leave empty,
        together with repo, for the default behaviour.
      required: false
      advanced: true
      pattern: '^[\w.-]{1,255}$'
      example: octocat
    - name: repo
      description: Paired with owner, the one repository name to index.
      required: false
      advanced: true
      pattern: '^[\w.-]{1,255}$'
      example: my-thesis
    - name: ref
      description: >-
        Branch, tag or commit to index, when owner and repo are also set —
        otherwise each repository's own default branch is used
        automatically. A branch name containing a slash (e.g. release/1.0)
        is not supported here, since it is used as a single URL path
        segment upstream.
      required: false
      advanced: true
      example: main

  secrets:
    - name: token
      description: >-
        Gitea personal access token (Settings → Applications → Generate New
        Token) with read access to Repository. Required for indexing: the
        repository-listing tool this connector's semantic search relies on
        needs an authenticated identity, and a public repository accessed
        anonymously is also subject to a much lower rate limit.
      required: false

  defaults:
    headers:
      Accept: application/json
    timeoutMs: 15000
    maxResponseBytes: 8388608
    rateLimitPerMin: 120
    maxConcurrent: 4

  tools:
    - name: gitea_list_repos
      title: List accessible repositories
      description: >-
        List repositories the configured token can see — owned, collaborator
        access, or organisation membership — newest first, one page at a
        time. Each entry includes owner.login, name, default_branch and
        visibility. Without a token this typically returns nothing, since it
        asks Gitea for "the authenticated user's" repositories.
      annotations:
        readOnlyHint: true
        openWorldHint: false
      inputSchema:
        type: object
        additionalProperties: false
        properties:
          page:
            type: integer
            description: Page number, starting at 1.
            minimum: 1
          limit:
            type: integer
            description: Repositories per page.
            minimum: 1
            maximum: 50
      request:
        method: GET
        path: /api/v1/user/repos
        query:
          page: "{{input.page|default:1}}"
          limit: "{{input.limit|default:50}}"
      response:
        successCodes: [200]
        format: json

    - name: gitea_get_repo
      title: Get repository info
      description: >-
        Fetch metadata for one repository — description, default branch,
        size, star/fork counts. Useful to confirm access and discover a
        repository's actual default branch name.
      annotations:
        readOnlyHint: true
        openWorldHint: false
      inputSchema:
        type: object
        additionalProperties: false
        required: [owner, repo]
        properties:
          owner:
            type: string
            description: Repository owner — a user or organisation name.
            pattern: '^[\w.-]{1,255}$'
          repo:
            type: string
            description: Repository name.
            pattern: '^[\w.-]{1,255}$'
      request:
        method: GET
        path: /api/v1/repos/{{input.owner}}/{{input.repo}}
      response:
        successCodes: [200]
        format: json

    - name: gitea_list_tree
      title: List repository files
      description: >-
        List every file and directory in one repository at one ref,
        recursively, as a flat array of {path, type, sha, size}. Use this to
        find a file's blob SHA before reading it with gitea_get_file. Large
        repositories may be truncated by the upstream API; the response's
        "truncated" field says so.
      annotations:
        readOnlyHint: true
        openWorldHint: false
      inputSchema:
        type: object
        additionalProperties: false
        required: [owner, repo, ref]
        properties:
          owner:
            type: string
            description: Repository owner — a user or organisation name.
            pattern: '^[\w.-]{1,255}$'
          repo:
            type: string
            description: Repository name.
            pattern: '^[\w.-]{1,255}$'
          ref:
            type: string
            description: Branch, tag or commit, e.g. main.
      request:
        method: GET
        path: /api/v1/repos/{{input.owner}}/{{input.repo}}/git/trees/{{input.ref}}
        query:
          recursive: "true"
      response:
        successCodes: [200]
        format: json

    - name: gitea_get_file
      title: Get file contents
      description: >-
        Fetch one file's content by blob SHA — get the SHA for a path from
        gitea_list_tree's file listing first. The response's "content"
        field is base64-encoded (Gitea's own git-blob format); decode it to
        get the file's text. Not meant for binary files.
      annotations:
        readOnlyHint: true
        openWorldHint: false
      inputSchema:
        type: object
        additionalProperties: false
        required: [owner, repo, sha]
        properties:
          owner:
            type: string
            description: Repository owner — a user or organisation name.
            pattern: '^[\w.-]{1,255}$'
          repo:
            type: string
            description: Repository name.
            pattern: '^[\w.-]{1,255}$'
          sha:
            type: string
            description: Blob SHA, from gitea_list_tree's "sha" field for the desired path.
            pattern: '^[0-9a-fA-F]{4,64}$'
      request:
        method: GET
        path: /api/v1/repos/{{input.owner}}/{{input.repo}}/git/blobs/{{input.sha}}
      response:
        successCodes: [200]
        format: json
        maxBytes: 4194304
